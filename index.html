<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">

<style>
/* Layout: estructura tipo agencia de edición — fondo negro, tarjetas oscuras redondeadas, brillos de luz blanca; B/N de marca */
:root{
  --bg:#0b0b0c; --card:#141415; --card2:#1a1a1c; --line:#262628; --fg:#f5f5f5; --muted:#a1a1a6; --dim:#626266; --ink:#0b0b0c;
  --f-sans:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --f-hand:"Caveat", "Bradley Hand", cursive;
  --maxw:1240px; --r:28px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important; transition:none!important} }
body{background:var(--bg); color:var(--fg); font-family:var(--f-sans); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg); outline-offset:3px; border-radius:6px}
.muted{color:var(--muted)}

.wrap{max-width:var(--maxw); margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
@media (min-width:720px){ .wrap{padding-left:max(32px, env(safe-area-inset-left,0px)); padding-right:max(32px, env(safe-area-inset-right,0px))} }
section{position:relative; scroll-margin-top:72px}
.sec{padding-block:110px}
@media (max-width:640px){ .sec{padding-block:76px} }

h1,h2,h3{font-weight:600; letter-spacing:-.035em; text-wrap:balance; margin:0}
h2{font-size:clamp(32px,4.2vw,58px); line-height:1.04}
.tagpill{display:inline-block; font-size:14px; font-weight:500; color:var(--muted); border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 18px}
.head{display:flex; flex-direction:column; gap:20px; margin-bottom:56px; max-width:760px}
.head.center{align-items:center; text-align:center; margin-inline:auto}
.head p{margin:0; font-size:18px}
.glow{position:absolute; pointer-events:none; inset:0; overflow:hidden}
.glow::before{content:""; position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.10), transparent 60%)}
.glow.tl::before{left:-420px; top:-480px} .glow.br::before{right:-420px; bottom:-520px} .glow.c::before{left:50%; top:50%; transform:translate(-50%,-50%)}
.grad{background:linear-gradient(100deg,#ffffff 0%,#b9b9bd 55%,#7a7a7f 100%); -webkit-background-clip:text; background-clip:text; color:transparent}

/* Botones */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:12px; padding:17px 30px; border-radius:999px; font:600 16px var(--f-sans); text-decoration:none; border:0; cursor:pointer; transition:transform .2s, background .2s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:18px; height:18px; transition:transform .2s}
.btn:hover svg{transform:translateX(3px)}
.btn-main{background:linear-gradient(180deg,#ffffff,#d9d9dc); color:var(--ink); box-shadow:0 10px 30px -10px rgba(255,255,255,.35)}
.btn-text{background:none; color:var(--fg); padding-inline:6px}
.btn-line{background:transparent; color:var(--fg); border:1px solid var(--line)}
.btn-line:hover{border-color:var(--muted)}
.btn-sm{padding:11px 20px; font-size:14px}
.btns{display:flex; flex-wrap:wrap; align-items:center; gap:14px 26px}

/* NAV */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.nav .wrap{display:flex; align-items:center; gap:28px; padding-block:14px}
.logo{font-weight:700; font-size:20px; letter-spacing:-.04em; text-decoration:none; white-space:nowrap}
.nav-links{display:none; gap:28px; margin-left:auto; font-size:15px}
.nav-links a{text-decoration:none; color:var(--muted); transition:color .2s}
.nav-links a:hover{color:var(--fg)}
@media (min-width:960px){ .nav-links{display:flex} }
.nav-right{display:flex; gap:14px; align-items:center; margin-left:auto}
@media (min-width:960px){ .nav-right{margin-left:0} }
.lang{display:flex; font-family:var(--f-mono); font-size:12px}
.lang button{background:none; border:0; color:var(--dim); padding:6px; cursor:pointer; font:inherit}
.lang button[aria-pressed="true"]{color:var(--fg)}
@media (max-width:420px){ .nav .btn-sm{padding:10px 14px} .nav .wrap{gap:14px} }

/* HERO */
.hero{padding-block:72px 0; overflow:hidden}
.hero-grid{position:relative; display:grid; gap:56px; align-items:center}
@media (min-width:960px){ .hero-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); gap:64px} }
.hero h1{font-size:clamp(34px,5.2vw,76px); line-height:1.02; letter-spacing:-.045em}
.rotline{display:block; white-space:nowrap; min-height:1.02em}
#rot{white-space:nowrap}
.caret{display:inline-block; width:3px; height:.9em; background:var(--fg); margin-left:.08em; vertical-align:-.1em; animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.hero .sub{font-size:clamp(17px,1.5vw,20px); color:var(--muted); max-width:46ch; margin:28px 0 40px; font-weight:500}

.reel-wrap{position:relative; padding-top:44px}
.hand{position:absolute; top:0; left:-6px; font-family:var(--f-hand); font-size:30px; font-weight:600; color:var(--muted); display:flex; align-items:flex-end; gap:6px; transform:rotate(-4deg)}
.hand svg{width:54px; height:40px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; margin-bottom:-18px}
.reel{position:relative; display:block; aspect-ratio:4/5; max-width:100%; border-radius:var(--r); overflow:hidden; text-decoration:none; color:var(--fg); background:
  radial-gradient(80% 60% at 30% 20%, #3a3a3d 0%, transparent 70%),
  radial-gradient(70% 60% at 80% 90%, #2a2a2c 0%, transparent 70%), #121213; border:1px solid var(--line); box-shadow:0 40px 80px -40px rgba(255,255,255,.18)}
.reel img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.reel .lbl{position:absolute; left:20px; top:18px; font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; color:rgba(245,245,245,.75)}
.reel .play{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:84px; height:84px; border-radius:50%; background:rgba(255,255,255,.95); display:grid; place-items:center; transition:transform .25s; box-shadow:0 0 0 14px rgba(255,255,255,.08)}
.reel:hover .play{transform:translate(-50%,-50%) scale(1.06)}
.reel .play svg{width:22px; height:22px; fill:var(--ink); margin-left:4px}
.reel .cap{position:absolute; left:20px; right:20px; bottom:20px; display:flex; justify-content:space-between; align-items:end; gap:10px; font-size:14px}
.reel .cap b{font-size:18px; font-weight:600}
.reel .cap span{font-family:var(--f-mono); font-size:11px; color:rgba(245,245,245,.6)}
@media (max-width:959px){ .reel-wrap{max-width:420px} }

/* Abanico de reels */
.fan-wrap{position:relative; height:560px; max-width:100%}
@media (max-width:959px){ .fan-wrap{height:460px; max-width:480px; width:100%; margin-inline:auto} }
.fan{position:absolute; inset:0}
.fc{position:absolute; top:50%; left:50%; width:44%; aspect-ratio:9/16; border-radius:22px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(160deg,#2e2e31,#121213); box-shadow:0 30px 60px -20px rgba(0,0,0,.85); text-decoration:none; color:var(--fg); transition:filter .25s}
.fc:nth-child(1){transform:translate(-108%,-46%) rotate(-8deg)}
.fc:nth-child(2){transform:translate(-50%,-54%); z-index:2; width:48%; background:linear-gradient(160deg,#3a3a3d,#151516)}
.fc:nth-child(3){transform:translate(8%,-46%) rotate(8deg)}
a.fc:hover{filter:brightness(1.12)}
.fc img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.fc .tc{position:absolute; left:12px; top:12px; font-family:var(--f-mono); font-size:10.5px; color:rgba(245,245,245,.75)}
.fc .nm{position:absolute; left:14px; right:14px; bottom:14px; font-weight:600; font-size:15px; line-height:1.15}
.fc .bp{position:absolute; right:10px; bottom:10px; width:36px; height:36px; border-radius:50%; background:#fff; display:grid; place-items:center}
.fc .bp svg{width:11px; height:11px; fill:var(--ink); margin-left:2px}
.float-stat{position:absolute; left:0; bottom:28px; z-index:3; background:rgba(22,22,23,.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:18px; padding:16px 20px; display:flex; flex-direction:column; gap:4px; box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.float-stat b{font-size:36px; font-weight:600; letter-spacing:-.04em; line-height:1}
.float-stat span{font-size:13px; color:var(--muted)}

/* Presupuesto */
.quote-band{position:relative; overflow:hidden; border-radius:calc(var(--r) + 12px); border:1px solid var(--line); background:linear-gradient(135deg,#1b1b1d,#0f0f10); padding:clamp(28px,5vw,64px); display:grid; gap:40px; align-items:center}
@media (min-width:960px){ .quote-band{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:64px} }
.quote-band p{font-size:18px; margin:18px 0 32px; max-width:44ch}
.factors{position:relative; list-style:none; margin:0; padding:0; display:grid; gap:12px}
.factors li{display:flex; gap:16px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px 22px}
.factors svg{width:20px; height:20px; flex-shrink:0; margin-top:3px; stroke:var(--fg); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.factors b{display:block; font-size:17px}
.factors span{display:block; color:var(--muted); font-size:15px; margin-top:2px}

/* Clientes */
.trust{position:relative; margin-top:80px; padding-block:40px 64px}
.trust-in{display:grid; gap:22px; align-items:center}
@media (min-width:960px){ .trust-in{grid-template-columns:260px minmax(0,1fr); gap:36px} }
.trust-l b{display:block; font-size:18px; font-weight:600; line-height:1.3}
.trust-l span{display:block; font-size:14px; margin-top:6px}
.marquee{overflow:hidden; min-width:0; -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee:hover .track{animation-play-state:paused}
.track{display:flex; width:max-content; animation:slide 55s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.pill{display:flex; align-items:center; gap:16px; padding:10px 30px 10px 10px; margin-right:16px; border-radius:999px; background:linear-gradient(180deg,#1c1c1e,#141415); border:1px solid var(--line); white-space:nowrap}
.av{position:relative; width:56px; height:56px; border-radius:50%; overflow:hidden; background:#2a2a2c; display:grid; place-items:center; flex-shrink:0; font-weight:700; font-size:16px; color:var(--muted)}
.av img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.av.pend{outline:1px dashed #4a4a4e; outline-offset:-1px}
.pill b{display:block; font-weight:600; font-size:17px}
.pill .rb{display:block; font-size:14px; color:var(--muted)}
@media (max-width:640px){ .av{width:46px; height:46px} .pill b{font-size:15px} }

/* Sobre */
.statement{font-size:clamp(28px,3.8vw,54px); line-height:1.1; letter-spacing:-.035em; font-weight:500; max-width:24em; margin:28px 0 80px}
.about-row{display:grid; gap:36px; align-items:end}
@media (min-width:960px){ .about-row{grid-template-columns:minmax(0,.85fr) minmax(0,2fr); gap:48px} }
.about-row p{margin:0; font-size:18px; max-width:34ch}
.statcards{display:grid; gap:18px; grid-template-columns:repeat(auto-fit, minmax(min(100%,210px),1fr))}
.statcard{border:1px solid var(--line); border-radius:var(--r); padding:28px; min-height:240px; display:flex; flex-direction:column; justify-content:space-between; gap:24px; background:linear-gradient(180deg,#18181a,#111112); min-width:0}
.statcard .st{font-weight:500; font-size:17px; color:var(--muted)}
.statcard b{display:inline-block; font-size:clamp(44px,4.2vw,62px); line-height:1; font-weight:600; letter-spacing:-.04em; padding-right:.08em; white-space:nowrap; font-variant-numeric:tabular-nums}
.statcard .sl{display:block; font-size:18px; font-weight:600; margin-top:10px; white-space:nowrap}
@media (max-width:640px){ .statcard{min-height:200px} }

/* Testimonios */
.tgrid{display:grid; gap:18px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 330px), 1fr))}
.tcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:28px; display:flex; flex-direction:column; gap:22px; min-width:0}
.tcard header{display:flex; gap:14px; align-items:center}
.tcard header b{display:block; font-size:17px}
.tcard header span{font-size:14px; color:var(--muted)}
.tcard p{margin:0; font-size:17px; line-height:1.5; flex:1}
.tcard.pend{border-style:dashed; background:transparent}
.tcard.pend p{color:var(--dim); font-size:15px}
.tcard .btn{align-self:flex-start}
.center-link{display:flex; justify-content:center; margin-top:40px}

/* Qué hacemos */
.fgrid{display:grid; gap:18px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 330px), 1fr))}
.feat{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:30px; display:flex; flex-direction:column; gap:14px; min-width:0}
.feat .ic{width:52px; height:52px; border-radius:16px; background:var(--card2); border:1px solid var(--line); display:grid; place-items:center; margin-bottom:10px}
.feat .ic svg{width:24px; height:24px; stroke:var(--fg); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.feat h3{font-size:22px; letter-spacing:-.02em}
.feat p{margin:0; color:var(--muted)}

/* Servicios con pestañas */
.tabs{display:inline-flex; flex-wrap:wrap; gap:6px; background:var(--card); border:1px solid var(--line); padding:6px; border-radius:999px; margin-bottom:44px}
.tabs button{border:0; background:none; color:var(--muted); font:600 15px var(--f-sans); padding:12px 22px; border-radius:999px; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg); color:var(--ink)}
.svc-panel{background:var(--card); border:1px solid var(--line); border-radius:calc(var(--r) + 8px); padding:clamp(24px,4vw,48px); display:grid; gap:40px}
.svc-top{display:grid; gap:20px; align-items:end}
@media (min-width:960px){ .svc-top{grid-template-columns:minmax(0,1fr) auto} }
.svc-top .eyebrow{font-family:var(--f-hand); font-size:28px; font-weight:600; color:var(--muted)}
.svc-top h3{font-size:clamp(28px,3.2vw,44px); margin:6px 0 14px}
.svc-top p{margin:0; color:var(--muted); max-width:56ch; font-size:17px}
.wgrid{display:grid; gap:18px}
.wg-youtube{grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr))}
.wg-reels{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){ .wg-reels{grid-template-columns:repeat(4,minmax(0,1fr))} }
.wg-diseno{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){ .wg-diseno{grid-template-columns:repeat(3,minmax(0,1fr))} }
.work{display:flex; flex-direction:column; gap:12px; text-decoration:none; color:inherit; min-width:0}
.thumb{position:relative; border-radius:18px; overflow:hidden; background:linear-gradient(160deg,#2a2a2c,#121213); max-width:100%; border:1px solid var(--line)}
.thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .5s}
a.work:hover .thumb img{transform:scale(1.04)}
.r169{aspect-ratio:16/9} .r916{aspect-ratio:9/16} .r45{aspect-ratio:4/5}
.thumb .nm{position:absolute; left:14px; bottom:12px; right:14px; font-weight:600; font-size:15px; color:#fff}
.thumb .bp{position:absolute; right:12px; top:12px; width:38px; height:38px; border-radius:50%; background:#fff; display:grid; place-items:center}
.thumb .bp svg{width:12px; height:12px; fill:var(--ink); margin-left:2px}
.thumb .dur{position:absolute; left:12px; top:12px; font-family:var(--f-mono); font-size:11px; background:rgba(0,0,0,.7); color:#fff; padding:3px 7px; border-radius:6px}
.work .wt{font-weight:600; font-size:15px; line-height:1.3}
.work .wc{font-size:13px; color:var(--muted)}
.work.pend .thumb{border-style:dashed; background:repeating-linear-gradient(135deg,#131314 0 10px,#18181a 10px 20px)}
.chip{display:inline-block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px dashed var(--dim); color:var(--dim); align-self:flex-start}

/* Casos */
.cgrid{display:grid; gap:18px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr))}
.case{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.case .ph{position:relative; aspect-ratio:16/10; background:linear-gradient(160deg,#2c2c2e,#141415)}
.case .ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(.2)}
.case .ph .cn{position:absolute; left:20px; bottom:16px; font-weight:600; font-size:20px}
.case .body{padding:26px 28px 28px; display:flex; flex-direction:column; gap:16px; flex:1}
.case .big{font-size:clamp(40px,4vw,56px); font-weight:600; letter-spacing:-.05em; line-height:1}
.case .bl{font-size:15px; color:var(--muted)}
.case p{margin:0; font-size:16px; flex:1}
.case.pend .big{color:var(--dim)}
.case.pend p{color:var(--dim); font-size:14px}

/* Cómo funciona */
.steps{display:grid; gap:18px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr))}
.step{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:30px; display:flex; flex-direction:column; gap:12px}
.step .n{width:46px; height:46px; border-radius:50%; background:var(--fg); color:var(--ink); display:grid; place-items:center; font-weight:700; font-size:18px; margin-bottom:12px}
.step h3{font-size:22px; letter-spacing:-.02em}
.step p{margin:0; color:var(--muted)}

/* Precios */
.pgrid{display:grid; gap:18px}
@media (min-width:960px){ .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.price{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:32px; display:flex; flex-direction:column; gap:20px; min-width:0}
.price.hl{background:linear-gradient(180deg,#f5f5f5,#d6d6d9); color:var(--ink); border-color:transparent}
.price .top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.price h3{font-size:24px; letter-spacing:-.02em}
.price .badge{font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px; background:var(--ink); color:var(--fg)}
.price .amt{font-size:46px; font-weight:600; letter-spacing:-.05em; line-height:1}
.price .amt small{font-size:15px; font-weight:500; letter-spacing:0; color:var(--muted); margin-left:6px}
.price.hl .amt small, .price.hl .det{color:#4a4a4e}
.price .det{color:var(--muted); font-weight:500}
.price ul{list-style:none; margin:0; padding:20px 0 0; border-top:1px solid var(--line); display:grid; gap:12px}
.price.hl ul{border-color:rgba(0,0,0,.12)}
.price li{display:flex; gap:12px; align-items:flex-start}
.price li svg{width:18px; height:18px; flex-shrink:0; margin-top:3px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.price .btn{margin-top:auto; width:100%}
.price.hl .btn{background:var(--ink); color:var(--fg); box-shadow:none}

/* Banner final */
.cta-band{position:relative; overflow:hidden; border-radius:calc(var(--r) + 12px); border:1px solid var(--line); background:linear-gradient(135deg,#1b1b1d,#0f0f10); padding:clamp(32px,6vw,80px); display:grid; gap:40px; align-items:center}
@media (min-width:960px){ .cta-band{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)} }
.cta-band h2{font-size:clamp(34px,4.6vw,64px)}
.cta-band p{font-size:18px; margin:18px 0 32px}
.stack{position:relative; height:320px}
.stack .s{position:absolute; border-radius:20px; border:1px solid var(--line); background:linear-gradient(160deg,#2e2e31,#151516); box-shadow:0 30px 60px -30px rgba(0,0,0,.8); overflow:hidden}
.stack .s img{width:100%; height:100%; object-fit:cover}
.stack .s1{width:70%; aspect-ratio:16/9; left:0; top:20px; transform:rotate(-4deg)}
.stack .s2{width:38%; aspect-ratio:9/16; right:4%; top:0; transform:rotate(5deg); max-height:320px}
.stack .s .p{position:absolute; inset:0; display:grid; place-items:center}
.stack .s .p span{width:54px; height:54px; border-radius:50%; background:#fff; display:grid; place-items:center}
.stack .s .p svg{width:16px; height:16px; fill:var(--ink); margin-left:3px}
@media (max-width:959px){ .stack{height:240px} .stack .s2{max-height:240px} }

/* FAQ */
.faq{display:grid; gap:12px; max-width:880px; margin:0 auto}
.faq details{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:0 26px}
.faq summary{list-style:none; cursor:pointer; padding:22px 0; display:flex; justify-content:space-between; gap:20px; font-weight:600; font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; font-size:24px; line-height:1; font-weight:400; color:var(--muted); transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 24px; color:var(--muted); max-width:66ch}

/* Footer */
footer{border-top:1px solid var(--line); padding-block:72px 32px; scroll-margin-top:72px}
.fcols{display:grid; gap:40px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr))}
.fcols h4{font-size:14px; font-weight:600; color:var(--muted); margin:0 0 16px; letter-spacing:0}
.fcols ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.fcols a{text-decoration:none} .fcols a:hover{text-decoration:underline}
.fbrand p{color:var(--muted); margin:14px 0 22px; max-width:30ch}
.ch{display:flex; flex-direction:column; gap:2px; min-width:0}
.ch .k{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.ch .v{font-weight:600; overflow-wrap:anywhere; user-select:all}
.ch .v.pend{color:var(--dim); font-weight:400; font-style:italic}
.ch .acts{display:flex; gap:8px; margin-top:6px}
.ch .acts button,.ch .acts a{font:500 12px var(--f-sans); color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; text-decoration:none}
.fbottom{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:64px; padding-top:24px; border-top:1px solid var(--line); font-size:13px; color:var(--dim)}
</style>

</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ytId = url => { const m = String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/); return m ? m[1] : ""; };
const ytThumb = url => { const id = ytId(url); return id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : ""; };
const img = src => src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : "";
const initials = n => String(n).split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
const $ = id => document.getElementById(id);

let lang = "es", stab = "youtube", ptab = "reels";
try { lang = localStorage.getItem("etm-lang") || ((navigator.language||"es").startsWith("es") ? "es" : "en"); } catch(e){}
if (!T[lang]) lang = "es";
const t = k => T[lang][k];
const L = o => (o && (o[lang] || o.es)) || "";

function waLink(){ const w = CONFIG.contacto.whatsapp; if (!w) return ""; if (/^https?:/.test(w)) return w; return `https://wa.me/${w}?text=${encodeURIComponent(t("wa.msg"))}`; }

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  // CTAs: empezar → WhatsApp si está cargado; llamada → agenda si está cargada
  const wa = waLink(), ag = CONFIG.contacto.agenda;
  document.querySelectorAll(".js-start").forEach(a => { if (wa){ a.href = wa; a.target = "_blank"; a.rel = "noopener"; } else { a.href = "#contacto"; a.removeAttribute("target"); } });
  document.querySelectorAll(".js-call").forEach(a => { if (ag){ a.href = ag; a.target = "_blank"; a.rel = "noopener"; } else if (wa){ a.href = wa; a.target = "_blank"; a.rel = "noopener"; } else { a.href = "#contacto"; } });

  // Abanico de reels del inicio (los 3 primeros reels)
  $("fan").innerHTML = CONFIG.trabajos.reels.items.slice(0,3).map((it,i) => {
    const src = it.portada || ytThumb(it.link), tag = it.link ? "a" : "div";
    const attrs = it.link ? `href="${esc(it.link)}" target="_blank" rel="noopener"` : "";
    return `<${tag} class="fc" ${attrs}>${img(src)}<span class="tc">● 0:${15 + i*12}</span>${src ? "" : `<span class="nm">${esc(it.cliente)}</span>`}${it.link ? `<span class="bp">${PLAY}</span>` : ""}</${tag}>`;
  }).join("");
  const big = CONFIG.stats.find(x => /M/.test(x.valor)) || CONFIG.stats[0];
  $("fstat").innerHTML = `<b class="grad">${esc(big.valor)}</b><span>${esc(L(big.label))}</span>`;

  // Clientes
  const pills = CONFIG.clientes.map(c => `<div class="pill"><div class="av ${c.foto ? "" : "pend"}">${esc(initials(c.nombre))}${img(c.foto)}</div><div><b>${esc(c.nombre)}</b>${L(c.rubro) ? `<span class="rb">${esc(L(c.rubro))}</span>` : ""}</div></div>`).join("");
  $("track").innerHTML = pills + pills;

  // Números
  $("stats").innerHTML = CONFIG.stats.map(x => `<div class="statcard"><span class="st">${esc(L(x.titulo))}</span><div><b class="grad">${esc(x.valor)}</b><span class="sl">${esc(L(x.label))}</span></div></div>`).join("");

  // Testimonios
  const ts = CONFIG.testimonios.filter(x => CONFIG.mostrarPendientes || L(x.texto));
  $("tgrid").innerHTML = ts.map(x => `
    <article class="tcard ${L(x.texto) ? "" : "pend"}">
      <header><div class="av ${x.foto ? "" : "pend"}">${esc(initials(x.nombre))}${img(x.foto)}</div><div><b>${esc(x.nombre)}</b><span>${esc(L(x.rubro))}</span></div></header>
      <p>${L(x.texto) ? "“" + esc(L(x.texto)) + "”" : esc(t("test.pending"))}</p>
      ${x.link ? `<a class="btn btn-line btn-sm" href="${esc(x.link)}" target="_blank" rel="noopener">${t("test.case")} ${ARROW}</a>` : ""}
    </article>`).join("");
  $("testimonios").hidden = ts.length === 0;

  // Qué hacemos
  $("fgrid").innerHTML = t("feat").map(f => `<article class="feat"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[f[0]]}</svg></div><h3>${esc(f[1])}</h3><p>${esc(f[2])}</p></article>`).join("");

  // Casos
  const cs = CONFIG.casos.filter(c => CONFIG.mostrarPendientes || c.dato);
  $("cgrid").innerHTML = cs.map(c => {
    const ok = c.dato && L(c.cita);
    return `<article class="case ${ok ? "" : "pend"}">
      <div class="ph">${img(c.foto)}<span class="cn">${esc(c.cliente)}</span></div>
      <div class="body">
        <div><div class="big ${c.dato ? "grad" : ""}">${esc(c.dato || "+—")}</div><div class="bl">${esc(L(c.datoLabel))}</div></div>
        <p>${L(c.cita) ? "“" + esc(L(c.cita)) + "”" : esc(t("cases.pending"))}</p>
        ${c.link ? `<a class="btn btn-line btn-sm" style="align-self:flex-start" href="${esc(c.link)}" target="_blank" rel="noopener">${t("cases.see")} ${ARROW}</a>` : ""}
      </div></article>`;
  }).join("");
  $("casos").hidden = cs.length === 0;

  // Proceso
  $("steps").innerHTML = t("proc").map((s,i) => `<article class="step"><div class="n">${i+1}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></article>`).join("");

  // Banner
  const sReel = CONFIG.trabajos.reels.items.find(i => i.portada || ytThumb(i.link));
  const sYt = CONFIG.trabajos.youtube.items.find(i => ytThumb(i.link));
  const playBox = `<div class="p"><span>${PLAY}</span></div>`;
  $("stack").innerHTML = `<div class="s s1">${sYt ? img(ytThumb(sYt.link)) : ""}${playBox}</div><div class="s s2">${sReel ? img(sReel.portada || ytThumb(sReel.link)) : ""}${playBox}</div>`;

  // FAQ
  $("faq-list").innerHTML = t("faq").map((q,i) => `<details id="faq-${i}"><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join("");

  renderContact(); renderServices(); renderPrices();
}

function renderServices(){
  const data = CONFIG.trabajos[stab], txt = t("svc." + stab);
  const items = data.items.filter(x => CONFIG.mostrarPendientes || x.link || x.imagen);
  const ratio = stab === "youtube" ? "r169" : stab === "reels" ? "r916" : "r45";
  const cards = items.map(it => {
    const src = stab === "youtube" ? ytThumb(it.link) : stab === "reels" ? (it.portada || ytThumb(it.link)) : it.imagen;
    const pend = !(it.link || it.imagen);
    const tag = it.link ? "a" : "div";
    const attrs = it.link ? `href="${esc(it.link)}" target="_blank" rel="noopener"` : "";
    return `<${tag} class="work ${pend ? "pend" : ""}" ${attrs}>
      <div class="thumb ${ratio}">${img(src)}${it.duracion ? `<span class="dur">${esc(it.duracion)}</span>` : ""}${stab !== "diseno" && it.link ? `<span class="bp">${PLAY}</span>` : ""}${src ? "" : `<span class="nm">${esc(it.cliente)}</span>`}</div>
      <div><div class="wt">${esc(L(it.titulo))}</div><div class="wc">${esc(it.cliente)}</div></div>
      ${pend ? `<span class="chip">${esc(stab === "diseno" ? t("pending.img") : t("pending"))}</span>` : ""}
    </${tag}>`;
  }).join("");
  $("svc-panel").innerHTML = `
    <div class="svc-top">
      <div><div class="eyebrow">${esc(txt[0])}</div><h3>${esc(txt[1])}</h3><p>${esc(txt[2])}</p></div>
      ${data.masEjemplos ? `<a class="btn btn-line btn-sm" href="${esc(data.masEjemplos)}" target="_blank" rel="noopener">${t("svc.more")} ${ARROW}</a>` : ""}
    </div>
    <div class="wgrid wg-${stab}">${cards}</div>`;
  ["youtube","reels"].forEach(k => $("stab-" + k).setAttribute("aria-selected", k === stab));
}

function renderPrices(){
  $("factors").innerHTML = t("price.factors").map(f => `<li>${CHECK}<div><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div></li>`).join("");
}

function renderContact(){
  const c = CONFIG.contacto;
  const rows = [
    { k:t("ct.wa"), v:c.whatsapp ? (/^https?:/.test(c.whatsapp) ? t("ct.wa.chat") : "+" + c.whatsapp) : "", copy:waLink(), href:waLink(), act:"WhatsApp ↗" },
    { k:t("ct.mail"), v:c.email, href:"", act:"" },
    { k:t("ct.ig"), v:c.instagram ? "@" + c.instagram : "", href:c.instagram ? `https://instagram.com/${c.instagram}` : "", act:t("ct.open") + " ↗" }
  ];
  $("channels").innerHTML = rows.map((r,i) => `
    <div class="ch"><span class="k">${esc(r.k)}</span><span class="v ${r.v ? "" : "pend"}">${esc(r.v || t("ct.pending"))}</span>
      ${r.v ? `<div class="acts">${r.href ? `<a href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.act)}</a>` : ""}<button type="button" id="copy-${i}" data-copy="${esc(r.copy || r.v)}">${esc(t("ct.copy"))}</button></div>` : ""}
    </div>`).join("");
}

document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]");
  if (lb){ lang = lb.dataset.lang; try{ localStorage.setItem("etm-lang", lang) }catch(_){} render(); startRotator(); return; }
  const sb = e.target.closest("[data-stab]");
  if (sb){ stab = sb.dataset.stab; renderServices(); return; }
  const sl = e.target.closest("[data-stab-link]");
  if (sl){ stab = sl.dataset.stabLink; renderServices(); }
  const pb = e.target.closest("[data-ptab]");
  if (pb){ ptab = pb.dataset.ptab; renderPrices(); return; }
  const cb = e.target.closest("[data-copy]");
  if (cb){
    const done = () => { cb.textContent = t("ct.copied"); setTimeout(() => cb.textContent = t("ct.copy"), 1500); };
    const sel = () => { const v = cb.closest(".ch").querySelector(".v"); const rg = document.createRange(); rg.selectNodeContents(v); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); };
    try { navigator.clipboard.writeText(cb.dataset.copy).then(done, sel); } catch(_) { sel(); }
  }
});

// Palabra que se escribe y se borra en el titular
let rotToken = 0;
function startRotator(){
  const my = ++rotToken, el = $("rot");
  const words = CONFIG.palabras[lang] || CONFIG.palabras.es;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async () => {
    for (let i = 0; my === rotToken; i = (i + 1) % words.length){
      const w = words[i];
      if (reduce){ el.textContent = w; await wait(2600); continue; }
      for (let n = 1; n <= w.length && my === rotToken; n++){ el.textContent = w.slice(0, n); await wait(75); }
      await wait(1700);
      for (let n = w.length - 1; n >= 0 && my === rotToken; n--){ el.textContent = w.slice(0, n); await wait(35); }
      await wait(250);
    }
  })();
}

render();
startRotator();
